<label class="form-label">参加状態<select class="form-select form-select-sm" name="lifecycle">
    {% for val, label in lifecycle_choices.items %}
        <option value="{{ val }}"
                {% if p.lifecycle == val %}selected{% endif %}>
            {{ label }}
        </option>
    {% endfor %}
</select></label>
<div class="row g-2">
    <label class="col-12 col-sm-6 form-label">確定日<input class="form-control form-control-sm" type="date" name="confirmed_date"
           value="{% if p.confirmed_date %}{{ p.confirmed_date|date:"Y-m-d" }}{% elif p.requested_date %}{{ p.requested_date|date:"Y-m-d" }}{% endif %}"></label>
    <label class="col-12 col-sm-6 form-label">開始時刻<input class="form-control form-control-sm" type="time" name="confirmed_start_time"
           value="{% if p.confirmed_start_time %}{{ p.confirmed_start_time|date:"H:i" }}{% elif p.requested_start_time %}{{ p.requested_start_time|date:"H:i" }}{% endif %}"></label>
</div>
<label class="form-label">開催時間<select class="form-select form-select-sm" name="confirmed_duration">
    {% for val, label in duration_choices %}
        <option value="{{ val }}"
                {% if p.confirmed_duration == val %}selected
                {% elif not p.confirmed_duration and p.requested_duration == val %}selected
                {% endif %}>
            {{ label }}
        </option>
    {% endfor %}
</select></label>
{% for pres in p.all_presentations %}
    <div class="d-flex align-items-center justify-content-between">
        <span class="small text-muted text-nowrap" title="{{ pres.speaker|default:'（未入力）' }}">
            {{ pres.speaker|default:"発表"|truncatechars:8 }}
        </span>
        <span class="d-flex gap-1 align-items-center">
            {% if pres.status == 'confirmed' or pres.published_event_detail %}
                <input class="form-control form-control-sm" type="time"
                       aria-label="{{ pres.speaker|default:'発表' }} の開始時刻" name="pres_{{ pres.pk }}_start_time"
                       value="{% if pres.published_event_detail %}{{ pres.published_event_detail.start_time|date:'H:i' }}{% elif pres.confirmed_start_time %}{{ pres.confirmed_start_time|date:'H:i' }}{% elif pres.requested_start_time %}{{ pres.requested_start_time|date:'H:i' }}{% endif %}"
                       step="300"
                       style="width: 5.5rem; padding: 0.1rem 0.2rem;">
            {% else %}
                <span class="small text-muted">&mdash;</span>
            {% endif %}

        </span>
    </div>
{% endfor %}
<label class="form-label">備考（運営）<textarea class="form-control form-control-sm" name="admin_note" rows="2"
          placeholder="備考（運営）">{{ p.admin_note }}</textarea></label>
{% if p.lifecycle == 'active' %}
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="confirm_withdraw" value="1" id="confirm-withdraw-{{ p.pk }}">
        <label class="form-check-label" for="confirm-withdraw-{{ p.pk }}">公開済みの発表を削除し、公開イベントとの連携を外すことを確認しました</label>
        <div class="form-text">「不参加」「辞退」に変更する場合だけチェックしてください。</div>
    </div>
{% endif %}
