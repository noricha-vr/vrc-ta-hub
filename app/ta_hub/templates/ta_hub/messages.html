{% if messages %}
    <div class="mb-4">
        {% for message in messages %}
            <div class="alert {% if message.level_tag == 'error' %}alert-danger{% else %}alert-{{ message.level_tag }}{% endif %}{% if message.extra_tags %} {{ message.extra_tags }}{% endif %} alert-dismissible fade show"
                 role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
