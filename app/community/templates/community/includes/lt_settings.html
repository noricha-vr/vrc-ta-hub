<form id="lt-form" data-admin-dirty method="post" action="{% url 'community:update_lt_settings' community.pk %}">
{% csrf_token %}
<div class="settings-field"><div class="settings-label">発表申請を受け付ける<small>ONにすると、イベントページに発表申請ボタンが表示されます。</small></div><div class="settings-control"><label class="settings-switch" for="accepts_lt_application"><input type="checkbox" id="accepts_lt_application" name="accepts_lt_application" {% if community.accepts_lt_application %}checked{% endif %} onchange="toggleLTSettings()"><span>受け付ける</span></label></div></div>
<div class="settings-field"><div class="settings-label">撮影許可<small>「許可しない」にすると、この集会の発表はハブの自動撮影の対象になりません。発表申請フォームにも撮影の選択肢を出さず、「禁止」で受け付けます。</small></div><div class="settings-control"><div class="settings-segment" role="radiogroup" aria-label="撮影許可">
<label for="recording_allowed_true"><input type="radio" id="recording_allowed_true" name="recording_allowed" value="true" {% if community.recording_allowed %}checked{% endif %} onchange="toggleRecordingSettings()"><span>許可する</span></label>
<label for="recording_allowed_false"><input type="radio" id="recording_allowed_false" name="recording_allowed" value="false" {% if not community.recording_allowed %}checked{% endif %} onchange="toggleRecordingSettings()"><span>許可しない</span></label></div></div></div>
<div id="default-recording-policy-section" style="{% if not community.recording_allowed %}display: none;{% endif %}"><div class="settings-field"><div class="settings-label">撮影ステータスの初期値<small>発表申請フォームで、撮影の選択肢の初期値になります。登壇者は申請時に変えられます。</small></div><div class="settings-control" role="radiogroup" aria-label="撮影ステータスの初期値">
{% for value, label in recording_policy_choices %}<label><input type="radio" id="default_recording_policy_{{ value }}" name="default_recording_policy" value="{{ value }}" {% if community.default_recording_policy == value %}checked{% endif %} onchange="markRecordingPolicyTouched()"> {{ label }}</label>{% endfor %}
<input type="hidden" id="default_recording_policy_chosen" name="default_recording_policy_chosen" value="">
</div></div></div>
<div id="lt-settings-detail" style="{% if not community.accepts_lt_application %}display: none;{% endif %}">
<div class="settings-field"><label for="lt_application_template" class="settings-label">追加情報テンプレート<small>入力すると、申請フォームの追加情報欄に初期値として表示されます。空の場合も自由記入欄として表示されます。</small></label><div class="settings-control"><textarea name="lt_application_template" id="lt_application_template" class="form-control" rows="4">{{ lt_application_template_display }}</textarea></div></div>
<div class="settings-field"><label for="default_lt_duration" class="settings-label">発表の持ち時間（初期値）<small>発表と質疑応答を含めた合計時間（分）。</small></label><div class="settings-control"><span class="settings-unit"><input type="number" name="default_lt_duration" id="default_lt_duration" class="form-control" min="1" value="{{ community.default_lt_duration|default:30 }}"><span>分</span></span></div></div>
<div class="settings-field"><label for="lt_start_offset_minutes" class="settings-label">最初の発表を始めるタイミング<small id="lt_start_offset_help">集会開始から何分後か。例：集会開始が22:00の場合、15分後なら発表開始は22:15です。</small></label><div class="settings-control"><span class="settings-unit"><input type="number" name="lt_start_offset_minutes" id="lt_start_offset_minutes" class="form-control" min="0" aria-describedby="lt_start_offset_help" value="{{ community.lt_start_offset_minutes }}"><span>分後</span></span></div></div>
</div></form>
    <script>
    function toggleLTSettings() {
        var checkbox = document.getElementById('accepts_lt_application');
        var detailSection = document.getElementById('lt-settings-detail');
        if (checkbox.checked) {
            detailSection.style.display = 'block';
        } else {
            detailSection.style.display = 'none';
        }
    }
    var recordingPolicyTouched = false;
    function toggleRecordingSettings() {
        var allowed = document.getElementById('recording_allowed_true');
        var section = document.getElementById('default-recording-policy-section');
        section.style.display = allowed.checked ? 'block' : 'none';
        // 撮影を許可していなかった集会を「許可する」に切り替えた時は、撮影ステータスの初期値を「公開」にしておく。
        // 許可済みの集会で保存してある値と、この画面で主催者が選んだ値は変えない
        if (allowed.checked && !allowed.defaultChecked && !recordingPolicyTouched) {
            document.getElementById('default_recording_policy_public').checked = true;
        }
    }
    function markRecordingPolicyTouched() {
        recordingPolicyTouched = true;
    }
    (function () {
        var chosen = document.getElementById('default_recording_policy_chosen');
        // JS が動く画面では、許可に切り替えた時に JS が「公開」を選ぶため、送る初期値は主催者が画面で見ていた選択そのもの。
        // 戻る操作でフォームが復元されても hidden は空に戻るので、送信の直前に印を立てる
        chosen.form.addEventListener('submit', function () {
            chosen.value = '1';
        });
        // 戻る操作でフォームだけ復元された時に、初期値の欄の表示と「主催者が選んだか」を復元後の選択から戻す
        window.addEventListener('pageshow', function () {
            var allowed = document.getElementById('recording_allowed_true');
            var section = document.getElementById('default-recording-policy-section');
            section.style.display = allowed.checked ? 'block' : 'none';
            var radios = document.querySelectorAll('input[name="default_recording_policy"]');
            for (var i = 0; i < radios.length; i++) {
                // 画面を出した時と違う選択、または許可へ切り替え後に「公開」以外（JS は「公開」を選ぶ）なら主催者が選んだもの
                var switchedAndChanged = allowed.checked && !allowed.defaultChecked
                    && radios[i].checked && radios[i].value !== 'public';
                if (radios[i].checked !== radios[i].defaultChecked || switchedAndChanged) {
                    markRecordingPolicyTouched();
                    break;
                }
            }
        });
    })();
    </script>
