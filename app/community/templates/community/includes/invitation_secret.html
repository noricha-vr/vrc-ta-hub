<div class="community-invitation-secret">
{% include 'ta_hub/admin/includes/secret_field.html' with field=invitation.secret_field label='共有リンク' configured=True suffix=invitation.secret_suffix only %}
</div>
{% if invitation.shared_link %}
<label for="shared-link-{{ invitation.pk }}" class="form-label">共有するリンク（画面共有にご注意ください）</label>
<input id="shared-link-{{ invitation.pk }}" class="form-control mb-2" value="{{ invitation.shared_link }}" readonly>
<button class="btn btn-sm btn-outline-secondary" type="button" data-copy-invitation="shared-link-{{ invitation.pk }}">リンクをコピー</button>
<a href="{{ request.path }}#invitation-{{ invitation.pk }}" class="btn btn-sm btn-outline-secondary" data-hide-invitation="{{ invitation.pk }}">リンクを隠す</a>
{% else %}
<a href="?reveal_invitation={{ invitation.pk }}#invitation-{{ invitation.pk }}" class="btn btn-sm btn-outline-secondary" data-reveal-invitation="{{ invitation.pk }}">共有用にリンクを表示</a>
{% endif %}
<span class="small admin-muted" data-invitation-copy-status aria-live="polite"></span>
