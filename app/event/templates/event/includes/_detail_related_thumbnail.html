{% load image_tags %}
<div class="ratio ratio-16x9 ed-thumb">
    {% if item.thumbnail_url %}
        <img src="{{ item.thumbnail_url|cf_resize:'400' }}" class="w-100 h-100 object-fit-cover" alt="{{ item.h1 }}のサムネイル" loading="lazy" decoding="async">
    {% elif item.video_id %}
        <img src="https://img.youtube.com/vi/{{ item.video_id }}/mqdefault.jpg" class="w-100 h-100 object-fit-cover" alt="{{ item.h1 }}のサムネイル" loading="lazy" decoding="async">
    {% else %}
        <div class="ed-titlecard" aria-hidden="true">
            <span class="ed-titlecard-label"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M12 16v4M8 20h8"></path></svg>発表タイトル</span>
            <p class="ed-titlecard-theme">{{ item.theme }}</p>
        </div>
    {% endif %}
</div>
