<div class="mb-3 field-wrapper" data-field="{{ field.name }}">
    {% if field.name == 'generate_blog_article' %}
        <!-- 記事自動生成チェックボックスを特別に表示 -->
        <div class="form-check form-switch d-flex align-items-center">
            {{ field }}
            <label class="form-check-label ms-2 mb-0" for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>
        </div>
        {% if field.help_text %}
            <div class="form-text ms-5">{{ field.help_text }}</div>
        {% endif %}
    {% else %}
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
            <div class="form-text">{{ field.help_text }}</div>
        {% endif %}
    {% endif %}
    {% if field.errors %}
        <div class="text-danger">{{ field.errors }}</div>
    {% endif %}
</div>
