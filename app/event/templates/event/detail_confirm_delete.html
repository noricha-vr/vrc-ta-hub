{% extends 'ta_hub/base.html' %}

{% block main %}
    <div class="container my-4" style="max-width: 640px;">
        <h1 class="h4 mb-3">発表の削除: {{ object.event.community.name }}</h1>
        <div class="card" style="border-color: #e7b9b9; background: #fff6f6;">
            <div class="card-body">
                <p class="mb-2">次の発表を削除しますか？ この操作は取り消せません。</p>
                <ul class="mb-3">
                    <li>開催日: {{ object.event.date|date:"Y/m/d" }}</li>
                    <li>テーマ: {{ object.theme }}</li>
                    <li>発表者: {{ object.speaker }}</li>
                </ul>
                <form method="post" class="d-flex gap-2 flex-wrap">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">この発表を削除する</button>
                    <a href="{% url 'event:detail' object.pk %}" class="btn btn-outline-secondary">キャンセル</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
