steps:
  # ステップ1：Kanikoを使用してDockerイメージのビルドとプッシュ
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=${_DOCKER_PATH}${_SERVICE_NAME}:$SHORT_SHA'
      - '--destination=${_DOCKER_PATH}${_SERVICE_NAME}:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--dockerfile=./Dockerfile'

  # ステップ2：Google Cloud Runにイメージをデプロイ
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '--no-traffic'
      - '--allow-unauthenticated'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--region'
      - 'asia-northeast1'
      - '--image'
      - '${_DOCKER_PATH}${_SERVICE_NAME}:$SHORT_SHA'
      - '--platform'
      - 'managed'
      - '--revision-suffix'
      - '$SHORT_SHA'
      # FERNET_KEY: community.encrypted_fields の対称暗号化鍵。
      # 未設定だと notification_webhook_url 関連の操作で RuntimeError、
      # migration 0027 が即失敗する。
      # SENTRY_DSN: 本番エラー監視用。未設定なら Sentry 初期化スキップ
      # (settings/base.py で空文字ガード済み) なので必須ではないが、観測性のため設定推奨。
      # TURNSTILE_SECRET_KEY: ログイン画面の Cloudflare Turnstile の検証用シークレット（サイトキーとそろった時だけ有効）。
      # DISCORD_ANNOUNCE_WEBHOOK_URL: Discord 告知の予約送信の送信先（告知チャンネルの webhook）。未設定なら予約は送らずに失敗として記録する。
      # SECRET_KEY / AWS_* / AWS_SES_* / GOOGLE_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY / REQUEST_TOKEN:
      # Django の署名鍵・ストレージとメールの認証情報・外部 API のキー・API 呼び出し用トークン。平文の環境変数に置かない。
      # YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_ANALYTICS_REFRESH_TOKEN: YouTube Analytics の OAuth 認証情報。
      # MISSKEY_TOKEN: Misskey の告知 Bot のアクセストークン（write:notes / write:drive）。未設定なら Misskey への投稿をしない。
      # --set-secrets は一覧を丸ごと置き換えるので、Secret で渡す値はすべてここに並べる（漏れると次のデプロイで消える）。
      - '--set-secrets'
      - 'DB_PASSWORD=DB_PASSWORD:latest,DISCORD_WEBHOOK_URL=DISCORD_WEBHOOK_URL:latest,DISCORD_CLIENT_ID=DISCORD_CLIENT_ID:latest,DISCORD_CLIENT_SECRET=DISCORD_CLIENT_SECRET:latest,DISCORD_REPORT_WEBHOOK_URL=DISCORD_REPORT_WEBHOOK_URL:latest,X_API_KEY=X_API_KEY:latest,X_API_SECRET=X_API_SECRET:latest,X_ACCESS_TOKEN=X_ACCESS_TOKEN:latest,X_ACCESS_TOKEN_SECRET=X_ACCESS_TOKEN_SECRET:latest,FERNET_KEY=FERNET_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest,DISCORD_ANNOUNCE_WEBHOOK_URL=DISCORD_ANNOUNCE_WEBHOOK_URL:latest,SECRET_KEY=SECRET_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,AWS_SES_ACCESS_KEY_ID=AWS_SES_ACCESS_KEY_ID:latest,AWS_SES_SECRET_ACCESS_KEY=AWS_SES_SECRET_ACCESS_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,REQUEST_TOKEN=REQUEST_TOKEN:latest,YOUTUBE_CLIENT_ID=YOUTUBE_CLIENT_ID:latest,YOUTUBE_CLIENT_SECRET=YOUTUBE_CLIENT_SECRET:latest,YOUTUBE_ANALYTICS_REFRESH_TOKEN=YOUTUBE_ANALYTICS_REFRESH_TOKEN:latest,DISCORD_BOT_CLIENT_ID=DISCORD_BOT_CLIENT_ID:latest,DISCORD_BOT_CLIENT_SECRET=DISCORD_BOT_CLIENT_SECRET:latest,MISSKEY_TOKEN=MISSKEY_TOKEN:latest'
      # GA4_PROPERTY_ID: GA4 Data API のプロパティID
      # CORS_ALLOWED_ORIGINS: /api/ への CORS 許可オリジン (CSV)。本番フロントと連携サイト。
      # TURNSTILE_SITE_KEY: ログイン画面の Cloudflare Turnstile のサイトキー（公開値。ホスト名 vrc-ta-hub.com 用）。
      # MISSKEY_HOST: 告知を投稿する Misskey サーバー。コードの既定値は misskey.io なので必ず指定する。
      - '--update-env-vars'
      - '^|^GA4_PROPERTY_ID=444114283|CORS_ALLOWED_ORIGINS=https://vrc-ta-hub.com,https://it-infra-meetup.org|TURNSTILE_SITE_KEY=0x4AAAAAAFIx-kaCNvnLqGXv|MISSKEY_HOST=misskey.niri.la'
      - '${_SERVICE_NAME}'

  # 旧 `rev-*` タグの掃除のみ実施。カナリア検証用の `canary` タグは deploy-watch スキルが
  # 必要なタイミングで `gcloud run services update-traffic --update-tags=canary=<REV>` で付与する。
  # 参照: ~/.claude/skills/deploy-watch/SKILL.md（タグ運用は deploy-watch に集約）
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        LEGACY_TAGS="$$(
          gcloud run services describe "${_SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region='asia-northeast1' \
            --format='csv[no-heading](status.traffic[].tag)' \
          | tr ',' '\n' \
          | sed '/^$$/d' \
          | grep '^rev-' \
          | paste -sd, -
        )"

        if [ -z "$${LEGACY_TAGS}" ]; then
          echo 'No legacy rev-* tags to clean up.'
          exit 0
        fi

        gcloud run services update-traffic "${_SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region='asia-northeast1' \
          --remove-tags="$${LEGACY_TAGS}"

substitutions:
  _SERVICE_NAME: 'vrc-ta-hub'
  _DOCKER_PATH: 'asia-northeast1-docker.pkg.dev/vrc-ta-hub/docker/'
