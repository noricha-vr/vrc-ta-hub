# Dependabot: バージョン更新は全エコシステムで止め、セキュリティ更新だけを受ける（open-pull-requests-limit: 0。security updates は別枠）
# docker はベースイメージのメジャー更新で本番ビルドが壊れたため外した。ベースイメージは手で上げる
version: 2
updates:
  # uv: requirements.in / requirements-e2e.in（入力）と requirements.txt / requirements-e2e.txt
  # （uv pip compile の出力。本番と CI が入れる）の両方を書き換える。
  # pip エコシステムは pip-compile で作り直すので、uv で生成したロックには uv を使う
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 0
    ignore:
      # google-genai が tenacity<9.2.0 に制限しているため、上がるまで止めておく
      - dependency-name: "tenacity"
        versions: [">=9.2.0"]
    groups:
      security:                        # security updates も同じエコシステムで 1 本にまとめる
        applies-to: security-updates
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
