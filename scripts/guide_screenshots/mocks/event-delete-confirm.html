<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>イベント削除の確認イメージ</title>
<style>
* {box-sizing:border-box} body {margin:0;background:#f3f4f6;color:#202124;font:16px/1.7 sans-serif;padding:24px}
main {background:white;border:1px solid #cbd5e1;border-radius:12px;padding:28px;max-width:520px;margin:16px auto;box-shadow:0 4px 16px #0002}
small {display:block;color:#555;margin-bottom:16px} #message {white-space:pre-wrap} footer {display:flex;justify-content:flex-end;gap:22px;margin-top:26px}button {font:inherit;border:1px solid #dadce0;border-radius:24px;padding:7px 24px;background:white}#confirm {background:#1a73e8;color:white}
@media(max-width:450px) {body{padding:16px}main{padding:20px}footer{gap:18px}button{padding:7px 18px}}
</style>
<main><small>イメージ図：ブラウザの確認</small><strong>技術・学術系イベントHub</strong><p id="message"></p><footer><button id="cancel">キャンセル</button><button id="confirm">OK</button></footer></main>
</html>
