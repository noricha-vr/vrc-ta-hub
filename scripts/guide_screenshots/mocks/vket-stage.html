<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部でのステージ登録の流れ（イメージ図）</title>
<style>
body{margin:0;background:#f0f3f6;color:#243344;font:18px/1.6 sans-serif}main{box-sizing:border-box;width:min(720px,calc(100% - 48px));margin:32px auto;padding:28px;background:white;border:1px solid #cbd5e1;border-radius:16px}h1{font-size:24px}small{color:#526577}section{margin:28px 0;padding:16px;background:#f6f8fa;border:1px solid #d6dce4;border-radius:8px}button{font:inherit;padding:10px 20px;color:white;background:#355f88;border:0;border-radius:6px}.sample{border:2px dashed #93a7bd;padding:24px;margin-top:10px;text-align:center}@media(max-width:500px){main{padding:18px;font-size:16px}h1{font-size:20px}}
</style>
<main><small>イメージ図・実際の Vket の画面とは異なります</small><h1>外部サイトで登録を仕上げる</h1>
<section id="fields"><strong>コピーした入力値を貼り付ける</strong><p>URL／タイトル／本文／開始・終了日時<br>言語／開催会場／タグ</p><small>開催会場とタグは Hub の案内に合わせます。</small></section>
<section id="thumbnail"><strong>サムネイルをアップロードする</strong><div class="sample">保存した JPEG 画像（横長 16:9）</div></section>
<button id="complete" type="button">入力内容を確認して登録を完了</button><p><small>操作の流れを示す図です。実際の項目名や確定操作は外部サイトの案内を読んでください。</small></p></main></html>
