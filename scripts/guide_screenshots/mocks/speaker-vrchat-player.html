<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VRChat のプレイヤー例・イメージ図</title><style> *{box-sizing:border-box} body{margin:0;padding:18px;background:#edf1f7;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans",sans-serif;color:#18243a}.diagram{max-width:680px;margin:auto;padding:24px;background:white;border:1px solid #ccd4e1;border-radius:12px}header{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding-bottom:12px}small{color:#64748b}h1{font-size:23px;line-height:1.5}label{display:block;margin:20px 0 8px}button,.button{display:inline-block;padding:10px 18px;border:1px solid #3559b8;border-radius:6px;background:#3559b8;color:white;font:inherit;margin:8px 0}input,select{width:100%;padding:10px;border:1px solid #8a98af;border-radius:5px;font:inherit;color:inherit}p{margin:14px 0}.drop{border:2px dashed #7189b9;padding:24px 16px;text-align:center;border-radius:8px;margin-top:24px}.slide{background:#e8eefb;border:1px solid #9aadd7;padding:32px 14px;text-align:center;margin:20px 0}.seek{height:24px;background:linear-gradient(to right,#3559b8 20%,#cbd5e1 20%);border-radius:6px;margin:24px 0} @media(max-width:450px){body{padding:8px}.diagram{padding:18px}h1{font-size:21px}}</style><main class="diagram"><header><strong>VRChat のプレイヤー例</strong><small>イメージ図</small></header><h1>発表用のスライドシステム</h1><div class="slide">はじめてのワールド制作<br><small>1 ページ目</small></div><label for="url">動画 URL</label><input id="url" value="https://example.com/slides.mp4"><button id="load">読み込む（例）</button><div id="seek" class="seek" role="slider" aria-label="ページ送り"></div><p><small>URL の入力・再生・ページ送りの場所は、ワールドによって異なります。</small></p></main></html>
