<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord 認証のイメージ図</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px 22px;background:#202225;color:#f2f3f5;font:16px/1.65 system-ui,sans-serif}.oauth{max-width:470px;margin:auto;background:#313338;padding:28px;border-radius:12px}small{display:block;text-align:right;color:#b5bac1}.app{font-size:24px;font-weight:bold}h1{font-size:22px}ul{padding-left:24px}button{border:0;border-radius:4px;padding:12px 18px;color:white;background:#5865f2;font:inherit;cursor:pointer}.actions{display:flex;justify-content:space-between;gap:20px;margin-top:28px}#cancel{background:transparent}.account{background:#232428;padding:12px;border-radius:6px}

<main class="oauth"><small>イメージ図</small><p class="app">Discord</p><h1>外部アプリケーションが<br>アカウントへのアクセスを要求しています</h1><p><strong>技術・学術系イベントHub</strong></p><p class="account">ログイン中：ヒナ</p><p>このアプリケーションは次のことができます：</p><ul><li>ユーザー名、アバター、バナーにアクセス</li><li>メールアドレスにアクセス</li></ul><p>表示されるアカウントと許可する内容を確認してください。</p><div class="actions"><button id="cancel">キャンセル</button><button id="authorize">認証</button></div></main></html>
