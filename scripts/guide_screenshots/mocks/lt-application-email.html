<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>発表申請メールの例</title><style>body{margin:0;background:#eef2f6;font:16px/1.7 sans-serif;color:#263244}main{max-width:560px;margin:32px auto;padding:24px;background:white;box-sizing:border-box}small{color:#64748b}h1{font-size:22px;border-bottom:2px solid #06c}a{display:inline-block;background:#06c;color:white;padding:12px 24px;border-radius:5px}dl{padding:16px;background:#f5f7fa}dd{margin:0 0 12px}@media(max-width:600px){main{margin:12px;padding:20px}}</style><main><small>メールのイメージ図</small><p>件名：[さくら技術交流会] 新しい発表申請があります</p><h1>新しい発表の申請</h1><p>さくら 様</p><p>さくら技術交流会に新しい発表の申請がありました。</p><dl><dt>開催日</dt><dd>2030年4月8日</dd><dt>テーマ</dt><dd>身近な科学を楽しむ</dd><dt>発表者</dt><dd>アオイ</dd><dt>発表の持ち時間</dt><dd>30分</dd></dl><p><a id="review" href="https://example.com/event/application/2/review/">申請を確認する</a></p><small>このメールは集会の主催者に自動送信されています。</small></main></html>
